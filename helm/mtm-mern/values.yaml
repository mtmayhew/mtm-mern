image:
  repository: ghcr.io/mtmayhew/mtm-web
  tag: "7fafecff27b861c700fff0af2c466b6d8e1c9a51"
  pullPolicy: Always
apiImage:
  repository: ghcr.io/mtmayhew/mtm-api
  tag: "7fafecff27b861c700fff0af2c466b6d8e1c9a51"
  pullPolicy: Always
imagePullSecrets: 
  - name: ghcr-secret
web:
  replicas: 2
  nodePort: 30080
api:
  replicas: 1
mongodb:
  enabled: true
  image: mongo:7
  storageSize: 5Gi
  storageClassName: ""
  existingUriSecret: ""
  existingUriKey: MONGODB_URI
resources:
  web: {}
  api: {}
# Name of a manually created Secret containing optional SMTP_* and INQUIRY_NOTIFY_TO keys.
# Do not commit SMTP credentials in Helm values.
notificationSecretName: ""

# Secret holding the self-hosted ALTCHA HMAC signing key (required).
altchaSecretName: mtm-altcha
