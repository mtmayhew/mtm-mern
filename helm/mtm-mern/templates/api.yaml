apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: mtm-api}
  template:
    metadata:
      labels: {app: mtm-api}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.apiImage.repository }}:{{ .Values.apiImage.tag }}"
          imagePullPolicy: {{ .Values.apiImage.pullPolicy }}
          ports: [{containerPort: 3000}]
          env:
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.mongodb.existingUriSecret }}{{ .Values.mongodb.existingUriSecret }}{{ else }}mtm-mongodb-uri{{ end }}
                  key: {{ .Values.mongodb.existingUriKey }}
          readinessProbe:
            httpGet: {path: /api/ready, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mtm-api
spec:
  selector: {app: mtm-api}
  ports: [{port: 3000, targetPort: 3000}]
