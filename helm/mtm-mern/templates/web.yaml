apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtm-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app: mtm-web}
  template:
    metadata:
      labels: {app: mtm-web}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mtm-web
spec:
  type: NodePort
  selector: {app: mtm-web}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: {{ .Values.web.nodePort }}
