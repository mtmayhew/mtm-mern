apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mtm-mern
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_WITH_GITHUB_OWNER/REPLACE_WITH_REPO.git
    targetRevision: main
    path: helm/mtm-mern
    helm:
      releaseName: mtm-mern
  destination:
    server: https://kubernetes.default.svc
    namespace: mtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
